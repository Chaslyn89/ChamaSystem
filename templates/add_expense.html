{% extends "base.html" %}

{% block title %}Add Expense - ChamaLedger{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Add Expense</h1>
    
    <div class="bg-white rounded-lg shadow-md p-6">
        <form method="POST">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category *</label>
                    <select name="category" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
                        <option value="">Select Category</option>
                        <option value="Venue">Venue</option>
                        <option value="Refreshments">Refreshments</option>
                        <option value="Transport">Transport</option>
                        <option value="Stationery">Stationery</option>
                        <option value="Donation">Donation</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Amount (KES) *</label>
                    <input type="number" name="amount" required min="1" class="w-full border border-gray-300 rounded-lg px-4 py-2">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description *</label>
                    <input type="text" name="description" required placeholder="e.g., Meeting hall rental" class="w-full border border-gray-300 rounded-lg px-4 py-2">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Expense Date *</label>
                    <input type="date" name="expense_date" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="btn-primary">Add Expense</button>
                    <a href="{{ url_for('expenses') }}" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

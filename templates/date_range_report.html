{% extends "base.html" %}

{% block title %}Date Range Report - ChamaLedger{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">{{ report_type|title }} Report</h1>
    
    <div class="bg-white rounded-lg shadow-md p-6">
        <form method="GET" action="{% if report_type == 'contributions' %}{{ url_for('contributions_by_date') }}{% endif %}">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Start Date *</label>
                    <input type="date" name="start_date" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">End Date *</label>
                    <input type="date" name="end_date" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="btn-primary">Generate Report</button>
                    <a href="{{ url_for('reports') }}" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

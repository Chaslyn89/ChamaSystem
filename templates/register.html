{% extends "base.html" %}

{% block title %}Register - ChamaLedger{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12">
    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">💰 ChamaLedger</h1>
            <p class="text-gray-500 mt-2">Create Member Account</p>
        </div>
        
        <form method="POST">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                    <input type="text" name="name" required class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-emerald-500 focus:border-emerald-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
                    <input type="tel" name="phone" required placeholder="0712345678" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-emerald-500 focus:border-emerald-500">
                    <p class="text-xs text-gray-500 mt-1">This will be your login username</p>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email (Optional)</label>
                    <input type="email" name="email" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-emerald-500 focus:border-emerald-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password *</label>
                    <input type="password" name="password" required class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-emerald-500 focus:border-emerald-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password *</label>
                    <input type="password" name="confirm_password" required class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-emerald-500 focus:border-emerald-500">
                </div>
                
                <button type="submit" class="w-full bg-emerald-600 text-white font-semibold py-2 rounded-xl hover:bg-emerald-700 transition">
                    Register
                </button>
            </div>
        </form>
        
        <div class="mt-6 text-center text-sm text-gray-500">
            <p>Already have an account? <a href="{{ url_for('login') }}" class="text-emerald-600 hover:underline">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}

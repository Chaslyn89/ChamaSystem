{% extends "base.html" %}

{% block title %}Request Payout - ChamaLedger{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Request Payout</h1>
    
    <div class="bg-white rounded-lg shadow-md p-6">
        <form method="POST">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Member *</label>
                    <select name="member_id" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
                        <option value="">Select Member</option>
                        {% for member in members %}
                        <option value="{{ member.id }}">{{ member.name }} (Balance: KES {{ member.current_balance }})</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Amount (KES) *</label>
                    <input type="number" name="amount" required min="1" class="w-full border border-gray-300 rounded-lg px-4 py-2">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Purpose *</label>
                    <input type="text" name="purpose" required placeholder="e.g., School fees, Business investment, Emergency" class="w-full border border-gray-300 rounded-lg px-4 py-2">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Meeting (Optional)</label>
                    <select name="meeting_id" class="w-full border border-gray-300 rounded-lg px-4 py-2">
                        <option value="">Select Meeting</option>
                        {% for meeting in meetings %}
                        <option value="{{ meeting.id }}">{{ meeting.meeting_date }} - {{ meeting.venue }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="btn-primary">Submit Request</button>
                    <a href="{{ url_for('payouts') }}" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

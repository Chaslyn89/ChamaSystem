{% extends "base.html" %}

{% block title %}Add Meeting - ChamaLedger{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Schedule New Meeting</h1>
    
    <div class="bg-white rounded-lg shadow-md p-6">
        <form method="POST">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Meeting Date *</label>
                    <input type="date" name="meeting_date" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Venue *</label>
                    <input type="text" name="venue" required placeholder="e.g., Nairobi Hotel, Zoom" class="w-full border border-gray-300 rounded-lg px-4 py-2">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Agenda (Optional)</label>
                    <textarea name="agenda" rows="4" placeholder="1. Financial report&#10;2. Loan applications&#10;3. New members" class="w-full border border-gray-300 rounded-lg px-4 py-2"></textarea>
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="btn-primary">Schedule Meeting</button>
                    <a href="{{ url_for('meetings') }}" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

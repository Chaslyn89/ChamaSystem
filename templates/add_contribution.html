{% extends "base.html" %}

{% block title %}Add Contribution - ChamaLedger{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Record Contribution</h1>
    
    <div class="bg-white rounded-lg shadow-md p-6">
        <form method="POST">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Member *</label>
                    <select name="member_id" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
                        <option value="">Select Member</option>
                        {% for member in members %}
                        <option value="{{ member.id }}">{{ member.name }} (Balance: KES {{ member.current_balance }})</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Amount (KES) *</label>
                    <input type="number" name="amount" id="amount" required min="1" class="w-full border border-gray-300 rounded-lg px-4 py-2">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Payment Method *</label>
                    <select name="payment_method" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
                        <option value="cash">Cash</option>
                        <option value="mpesa">M-Pesa</option>
                        <option value="bank">Bank Transfer</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contribution Date *</label>
                    <input type="text" name="contribution_date" id="contribution_date" required placeholder="DD/MM/YYYY" class="w-full border border-gray-300 rounded-lg px-4 py-2">
                    <p class="text-xs text-gray-500 mt-1">Format: DD/MM/YYYY (e.g., 15/12/2024). Cannot be future date.</p>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Meeting (Optional)</label>
                    <select name="meeting_id" class="w-full border border-gray-300 rounded-lg px-4 py-2">
                        <option value="">Select Meeting</option>
                        {% for meeting in meetings %}
                        <option value="{{ meeting.id }}">{{ meeting.meeting_date }} - {{ meeting.venue }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Notes (Optional)</label>
                    <textarea name="notes" rows="3" placeholder="Additional notes..." class="w-full border border-gray-300 rounded-lg px-4 py-2"></textarea>
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="btn-primary">Record Contribution</button>
                    <a href="{{ url_for('contributions') }}" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    // Format date to DD/MM/YYYY and validate no future date
    const dateInput = document.getElementById('contribution_date');
    
    // Convert DD/MM/YYYY to YYYY-MM-DD for comparison
    function parseDateDMY(dateStr) {
        const parts = dateStr.split('/');
        if (parts.length === 3) {
            return new Date(parts[2], parts[1] - 1, parts[0]);
        }
        return null;
    }
    
    // Convert Date object to DD/MM/YYYY
    function formatToDMY(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${day}/${month}/${year}`;
    }
    
    // Validate on blur
    dateInput.addEventListener('blur', function() {
        const value = this.value.trim();
        const dateRegex = /^(\d{2})\/(\d{2})\/(\d{4})$/;
        
        if (!dateRegex.test(value)) {
            alert('Invalid date format. Use DD/MM/YYYY (e.g., 15/12/2024)');
            this.value = '';
            return;
        }
        
        const parsedDate = parseDateDMY(value);
        if (!parsedDate || isNaN(parsedDate)) {
            alert('Invalid date');
            this.value = '';
            return;
        }
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        if (parsedDate > today) {
            alert('Cannot select future date');
            this.value = '';
            return;
        }
    });
    
    // Set default value to today in DD/MM/YYYY format
    const today = new Date();
    dateInput.value = formatToDMY(today);
    
    // Validate amount
    const amountInput = document.getElementById('amount');
    amountInput.addEventListener('change', function() {
        if (this.value < 1) {
            alert('Amount must be at least KES 1');
            this.value = 1;
        }
    });
</script>
{% endblock %}
